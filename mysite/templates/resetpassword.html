<!-- templates/resetpassword.html -->

{% extends "base.html" %}

{% block content %}

<p>
An email with a password reset code and a 
password reset URL link will be sent to you.
The code is valid for {{ dtime }} hh:mm:ss.
</p>

<center>
<div class='form'>
  <form action={{ action }} method="post">
    {{ form.hidden_tag() }}
    
    <table>
      <tr>
	<td>{{ form.email.label }}</td>
	<td>{{ form.email }}</td>
      </tr>
      <tr>
	<td align=center colspan=2>
	  <input type="submit" value="Go">
	</td>
      <tr>
    </table>

  </form>
</div>
</center>

{% endblock %}
